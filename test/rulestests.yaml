rule_files:
    - ../tmp/rules.yaml
    - ../tmp/alert-rules.yaml

evaluation_interval: 1m

tests:
    # cluster:capacity_effective_cpu_cores tests
    - input_series:
          # amd64 worker node
          - series: 'cluster:capacity_cpu_cores:sum{label_node_openshift_io_os_id="rhcos",label_kubernetes_io_arch="amd64",_id="amd64_worker",tenant_id="tenant_id"}'
            values: '4'
          # non-amd64 worker node
          - series: 'cluster:capacity_cpu_cores:sum{label_node_openshift_io_os_id="rhcos",label_kubernetes_io_arch="arm64",_id="nonamd64_worker",tenant_id="tenant_id"}'
            values: '4'
          # amd64 schedulable control plane node
          - series: 'cluster:capacity_cpu_cores:sum{label_node_openshift_io_os_id="rhcos",label_kubernetes_io_arch="amd64",label_node_role_kubernetes_io="master",_id="amd64_control_plane_schedulable",tenant_id="tenant_id"}'
            values: '4'
          - series: 'cluster_master_schedulable{_id="amd64_control_plane_schedulable",tenant_id="tenant_id"}'
            values: '1'
          # non-amd64 schedulable control plane node
          - series: 'cluster:capacity_cpu_cores:sum{label_node_openshift_io_os_id="rhcos",label_kubernetes_io_arch="arm64",label_node_role_kubernetes_io="master",_id="non-amd64_control_plane_schedulable",tenant_id="tenant_id"}'
            values: '4'
          - series: 'cluster_master_schedulable{_id="non-amd64_control_plane_schedulable",tenant_id="tenant_id"}'
            values: '1'
          # amd64 non-schedulable control plane node
          - series: 'cluster:capacity_cpu_cores:sum{label_node_openshift_io_os_id="rhcos",label_kubernetes_io_arch="amd64",label_node_role_kubernetes_io="master",_id="amd64_control_plane_non_schedulable",tenant_id="tenant_id"}'
            values: '4'
          - series: 'cluster_master_schedulable{_id="amd64_control_plane_non_schedulable",tenant_id="tenant_id"}'
            values: '0'
          # amd64 infra node
          - series: 'cluster:capacity_cpu_cores:sum{label_node_openshift_io_os_id="rhcos",label_kubernetes_io_arch="amd64",label_node_role_kubernetes_io="infra",_id="amd64_infra",tenant_id="tenant_id"}'
            values: '4'
          - series: 'cluster_master_schedulable{_id="amd64_infra",tenant_id="tenant_id"}'
            values: '1'
          # non-amd64 non-schedulable control plane node
          - series: 'cluster:capacity_cpu_cores:sum{label_node_openshift_io_os_id="rhcos",label_kubernetes_io_arch="arm64",label_node_role_kubernetes_io="master",_id="non-amd64_control_plane_non_schedulable",tenant_id="tenant_id"}'
            values: '4'
          - series: 'cluster_master_schedulable{_id="non-amd64_control_plane_non_schedulable",tenant_id="tenant_id"}'
            values: '0'
          # non-amd64 infra node
          - series: 'cluster:capacity_cpu_cores:sum{label_node_openshift_io_os_id="rhcos",label_kubernetes_io_arch="amd64",label_node_role_kubernetes_io="infra",_id="non-amd64_infra",tenant_id="tenant_id"}'
            values: '4'
          - series: 'cluster_master_schedulable{_id="non-amd64_infra",tenant_id="tenant_id"}'
            values: '1'
      promql_expr_test:
          # amd64 worker (divided by 2)
          - expr: cluster:capacity_effective_cpu_cores{_id="amd64_worker"}
            eval_time: 0
            exp_samples:
                - labels: 'cluster:capacity_effective_cpu_cores{_id="amd64_worker",tenant_id="tenant_id"}'
                  value: 2
          # non-amd64 worker (not adjusted)
          - expr: cluster:capacity_effective_cpu_cores{_id="nonamd64_worker"}
            eval_time: 0
            exp_samples:
                - labels: 'cluster:capacity_effective_cpu_cores{_id="nonamd64_worker",tenant_id="tenant_id"}'
                  value: 4
          # amd64 schedulable control plane node (divided by 2)
          - expr: cluster:capacity_effective_cpu_cores{_id="amd64_control_plane_schedulable"}
            eval_time: 0
            exp_samples:
                - labels: 'cluster:capacity_effective_cpu_cores{_id="amd64_control_plane_schedulable",tenant_id="tenant_id"}'
                  value: 2
          # non-amd64 schedulable control plane node (not adjusted)
          - expr: cluster:capacity_effective_cpu_cores{_id="non-amd64_control_plane_schedulable"}
            eval_time: 0
            exp_samples:
                - labels: 'cluster:capacity_effective_cpu_cores{_id="non-amd64_control_plane_schedulable",tenant_id="tenant_id"}'
                  value: 4
          # amd64 non-schedulable control plane node excluded
          - expr: cluster:capacity_effective_cpu_cores{_id="amd64_control_plane_non_schedulable"}
            eval_time: 0
            exp_samples:
                - labels: 'cluster:capacity_effective_cpu_cores{_id="amd64_control_plane_non_schedulable",tenant_id="tenant_id"}'
                  value: 0
          # amd64 infra excluded
          - expr: cluster:capacity_effective_cpu_cores{_id="amd64_infra"}
            eval_time: 0
            exp_samples:
                - labels: 'cluster:capacity_effective_cpu_cores{_id="amd64_infra",tenant_id="tenant_id"}'
                  value: 0
          # non-amd64 non-schedulable control plane node excluded
          - expr: cluster:capacity_effective_cpu_cores{_id="non-amd64_control_plane_non_schedulable"}
            eval_time: 0
            exp_samples:
                - labels: 'cluster:capacity_effective_cpu_cores{_id="non-amd64_control_plane_non_schedulable",tenant_id="tenant_id"}'
                  value: 0
          # non-amd64 infra not included
          - expr: cluster:capacity_effective_cpu_cores{_id="non-amd64_infra"}
            eval_time: 0
            exp_samples:
                - labels: 'cluster:capacity_effective_cpu_cores{_id="non-amd64_infra",tenant_id="tenant_id"}'
                  value: 0
    # acm_capacity_effective_cpu_cores tests
    - input_series:
          # self-managed OpenShift cluster
          - series: 'acm_managed_cluster_info{product="OpenShift",_id="hub_cluster",managed_cluster_id="self_managed_ocp"}'
            values: '1'
          - series: 'acm_managed_cluster_info{product="OpenShift",_id="another_hub_cluster",managed_cluster_id="self_managed_ocp"}'
            values: '1'
          - series: 'acm_managed_cluster_worker_cores:max{_id="hub_cluster",managed_cluster_id="self_managed_ocp"}'
            values: '16'
          - series: 'acm_managed_cluster_worker_cores:max{_id="another_hub_cluster",managed_cluster_id="self_managed_ocp"}'
            values: '16'
          - series: 'cluster:capacity_effective_cpu_cores{_id="self_managed_ocp"}'
            values: '10'
          # self-managed OpenShift cluster with telemeter disabled
          - series: 'acm_managed_cluster_info{product="OpenShift",_id="hub_cluster",managed_cluster_id="self_managed_ocp_with_telemeter_disabled"}'
            values: '1'
          - series: 'acm_managed_cluster_info{product="OpenShift",_id="another_hub_cluster",managed_cluster_id="self_managed_ocp_with_telemeter_disabled"}'
            values: '1'
          - series: 'acm_managed_cluster_worker_cores:max{_id="hub_cluster",managed_cluster_id="self_managed_ocp_with_telemeter_disabled"}'
            values: '16'
          - series: 'acm_managed_cluster_worker_cores:max{_id="another_hub_cluster",managed_cluster_id="self_managed_ocp_with_telemeter_disabled"}'
            values: '16'
          # managed OpenShift cluster
          - series: 'acm_managed_cluster_info{product="ROSA",_id="hub_cluster",managed_cluster_id="managed_ocp_rosa"}'
            values: '1'
          - series: 'acm_managed_cluster_info{product="ROSA",_id="another_hub_cluster",managed_cluster_id="managed_ocp_rosa"}'
            values: '1'
          - series: 'acm_managed_cluster_worker_cores:max{_id="hub_cluster",managed_cluster_id="managed_ocp_rosa"}'
            values: '24'
          - series: 'acm_managed_cluster_worker_cores:max{_id="another_hub_cluster",managed_cluster_id="managed_ocp_rosa"}'
            values: '24'
          - series: 'cluster:capacity_effective_cpu_cores{_id="managed_ocp_rosa"}'
            values: '18'
          # non-OpenShift cluster
          - series: 'acm_managed_cluster_info{product="AKS",_id="hub_cluster",managed_cluster_id="none_ocp_aks"}'
            values: '1'
          - series: 'acm_managed_cluster_info{product="AKS",_id="another_hub_cluster",managed_cluster_id="none_ocp_aks"}'
            values: '1'
          - series: 'acm_managed_cluster_worker_cores:max{_id="hub_cluster",managed_cluster_id="none_ocp_aks"}'
            values: '32'
          - series: 'acm_managed_cluster_worker_cores:max{_id="another_hub_cluster",managed_cluster_id="none_ocp_aks"}'
            values: '32'
      promql_expr_test:
          - expr: acm_capacity_effective_cpu_cores
            eval_time: 0
            exp_samples:
                # self-managed OpenShift cluster (double the number of the physical cores)
                - labels: 'acm_capacity_effective_cpu_cores{_id="hub_cluster",managed_cluster_id="self_managed_ocp"}'
                  value: 20
                - labels: 'acm_capacity_effective_cpu_cores{_id="another_hub_cluster",managed_cluster_id="self_managed_ocp"}'
                  value: 20
                # self-managed OpenShift cluster with telemeter disabled (fall back to acm_managed_cluster_worker_cores:max)
                - labels: 'acm_capacity_effective_cpu_cores{_id="hub_cluster",managed_cluster_id="self_managed_ocp_with_telemeter_disabled"}'
                  value: 16
                - labels: 'acm_capacity_effective_cpu_cores{_id="another_hub_cluster",managed_cluster_id="self_managed_ocp_with_telemeter_disabled"}'
                  value: 16
                # managed OpenShift cluster
                - labels: 'acm_capacity_effective_cpu_cores{_id="hub_cluster",managed_cluster_id="managed_ocp_rosa"}'
                  value: 24
                - labels: 'acm_capacity_effective_cpu_cores{_id="another_hub_cluster",managed_cluster_id="managed_ocp_rosa"}'
                  value: 24
                # non-OpenShift cluster
                - labels: 'acm_capacity_effective_cpu_cores{_id="hub_cluster",managed_cluster_id="none_ocp_aks"}'
                  value: 32
                - labels: 'acm_capacity_effective_cpu_cores{_id="another_hub_cluster",managed_cluster_id="none_ocp_aks"}'
                  value: 32
    # acm_capacity_effective_cpu_cores:sum tests
    - input_series:
          # worker nodes only
          - series: 'acm_capacity_effective_cpu_cores{_id="hub_cluster0", managed_cluster_id="managed_cluster_id0"}'
            values: '10'
          - series: 'acm_capacity_effective_cpu_cores{_id="hub_cluster0", managed_cluster_id="managed_cluster_id00"}'
            values: '10'
          - series: 'acm_capacity_effective_cpu_cores{_id="hub_cluster0", managed_cluster_id="managed_cluster_id000"}'
            values: '10'
          # worker nodes plus hub
          - series: 'acm_capacity_effective_cpu_cores{_id="hub_cluster1", managed_cluster_id="hub_cluster1"}'
            values: '5'
          - series: 'acm_capacity_effective_cpu_cores{_id="hub_cluster1", managed_cluster_id="managed_cluster_id1"}'
            values: '10'
          - series: 'acm_capacity_effective_cpu_cores{_id="hub_cluster1", managed_cluster_id="managed_cluster_id11"}'
            values: '10'
      promql_expr_test:
          - expr: acm_capacity_effective_cpu_cores:sum
            eval_time: 0
            exp_samples:
                # worker nodes only
                - labels: 'acm_capacity_effective_cpu_cores:sum{_id="hub_cluster0"}'
                  value: 30
                # worker nodes plus hub
                - labels: 'acm_capacity_effective_cpu_cores:sum{_id="hub_cluster1"}'
                  value: 25
    # hostedcluster:hypershift_cluster_vcpus:vcpu_hours tests
    - interval: 1m
      input_series:
          - series: 'hostedcluster:hypershift_cluster_vcpus:max{_id="my-id", _mc_id="my-mc-id", mac_name="my-mc-name", exported_namespace="ocm-some-env-my-id"}'
            values: '0x90 4x90 0x90'
      promql_expr_test:
          - expr: hostedcluster:hypershift_cluster_vcpus:vcpu_hours
            eval_time: 0
            exp_samples:
                - labels: 'hostedcluster:hypershift_cluster_vcpus:vcpu_hours{_id="my-id"}'
                  value: 0
          - expr: hostedcluster:hypershift_cluster_vcpus:vcpu_hours
            eval_time: 60m
            exp_samples:
                - labels: 'hostedcluster:hypershift_cluster_vcpus:vcpu_hours{_id="my-id"}'
                  value: 0
          - expr: hostedcluster:hypershift_cluster_vcpus:vcpu_hours
            eval_time: 90m
            exp_samples:
                - labels: 'hostedcluster:hypershift_cluster_vcpus:vcpu_hours{_id="my-id"}'
                  value: 0
          - expr: hostedcluster:hypershift_cluster_vcpus:vcpu_hours
            eval_time: 122m
            exp_samples:
                - labels: 'hostedcluster:hypershift_cluster_vcpus:vcpu_hours{_id="my-id"}'
                  value: 2
          - expr: hostedcluster:hypershift_cluster_vcpus:vcpu_hours
            eval_time: 152m
            exp_samples:
                - labels: 'hostedcluster:hypershift_cluster_vcpus:vcpu_hours{_id="my-id"}'
                  value: 4
          - expr: hostedcluster:hypershift_cluster_vcpus:vcpu_hours
            eval_time: 180m
            exp_samples:
                - labels: 'hostedcluster:hypershift_cluster_vcpus:vcpu_hours{_id="my-id"}'
                  value: 4
          - expr: hostedcluster:hypershift_cluster_vcpus:vcpu_hours
            eval_time: 212m
            exp_samples:
                - labels: 'hostedcluster:hypershift_cluster_vcpus:vcpu_hours{_id="my-id"}'
                  value: 2
          - expr: hostedcluster:hypershift_cluster_vcpus:vcpu_hours
            eval_time: 242m
            exp_samples:
                - labels: 'hostedcluster:hypershift_cluster_vcpus:vcpu_hours{_id="my-id"}'
                  value: 0
          - expr: hostedcluster:hypershift_cluster_vcpus:vcpu_hours
            eval_time: 270m
            exp_samples:
                - labels: 'hostedcluster:hypershift_cluster_vcpus:vcpu_hours{_id="my-id"}'
                  value: 0
    # cluster:usage:control_plane:instance_hours tests
    # HCP cluster where data plane is down: cluster:usage:workload:capacity_physical_cpu_cores:max:5m
    # is not reported, but hostedcluster:hypershift_cluster_vcpus:max is reported from RH infrastructure
    - input_series:
          - series: 'hostedcluster:hypershift_cluster_vcpus:max{_id="hcp-data-plane-down", tenant_id="test"}'
            values: '0x90 4x90 0x90'
      promql_expr_test:
          # Before the control plane becomes active: no samples
          - expr: cluster:usage:control_plane:instance_hours{_id="hcp-data-plane-down"}
            eval_time: 60m
            exp_samples: []
          # Active for 30 min over the last hour
          - expr: cluster:usage:control_plane:instance_hours{_id="hcp-data-plane-down"}
            eval_time: 122m
            exp_samples:
                - labels: 'cluster:usage:control_plane:instance_hours{_id="hcp-data-plane-down"}'
                  value: 0.5
          # Active for the full hour
          - expr: cluster:usage:control_plane:instance_hours{_id="hcp-data-plane-down"}
            eval_time: 152m
            exp_samples:
                - labels: 'cluster:usage:control_plane:instance_hours{_id="hcp-data-plane-down"}'
                  value: 1
    # Backwards compatibility: both metrics present, non-HCP expression takes precedence via or
    - input_series:
          - series: 'cluster:usage:workload:capacity_physical_cpu_cores:max:5m{_id="both", tenant_id="test"}'
            values: '4x180'
          - series: 'hostedcluster:hypershift_cluster_vcpus:max{_id="both", tenant_id="test"}'
            values: '0x180'
      promql_expr_test:
          - expr: cluster:usage:control_plane:instance_hours{_id="both"}
            eval_time: 60m
            exp_samples:
                - labels: 'cluster:usage:control_plane:instance_hours{_id="both"}'
                  value: 1
    # rosa:cluster:vcpu_hours tests
    - input_series:
          - series: 'hostedcluster:hypershift_cluster_vcpus:vcpu_hours{_id="my-rosa-hcp-id"}'
            values: '32'
          - series: 'cluster:usage:workload:capacity_virtual_cpu_hours{_id="my-rosa-classic-id"}'
            values: '70'
          - series: 'hostedcluster:hypershift_cluster_vcpus:vcpu_hours{_id="my-rosa-idk-id"}'
            values: '36'
          - series: 'cluster:usage:workload:capacity_virtual_cpu_hours{_id="my-rosa-idk-id"}'
            values: '15'
      promql_expr_test:
          - expr: rosa:cluster:vcpu_hours
            eval_time: 0
            exp_samples:
                - labels: 'rosa:cluster:vcpu_hours{_id="my-rosa-hcp-id"}'
                  value: 32
                - labels: 'rosa:cluster:vcpu_hours{_id="my-rosa-classic-id"}'
                  value: 70
                - labels: 'rosa:cluster:vcpu_hours{_id="my-rosa-idk-id"}'
                  value: 36
    # acm:managed_cluster_worker_cores:self_managed:sum tests
    - input_series:
          # manged ROSA and ARO clusters running two different ACM hubs (and connected to themselves)
          - series: 'acm_managed_cluster_info{product="ROSA", _id="hub_cluster", hub_cluster_id="hub_cluster", managed_cluster_id="hub_cluster"}'
            values: '1'
          - series: 'acm_managed_cluster_info{product="ARO", _id="another_hub_cluster", hub_cluster_id="another_hub_cluster", managed_cluster_id="another_hub_cluster"}'
            values: '1'
          - series: 'acm_managed_cluster_worker_cores:max{_id="hub_cluster", hub_cluster_id="hub_cluster", managed_cluster_id="hub_cluster"}'
            values: '16'
          - series: 'acm_managed_cluster_worker_cores:max{_id="another_hub_cluster", hub_cluster_id="another_hub_cluster", managed_cluster_id="another_hub_cluster"}'
            values: '16'
          # self-managed OCP clusters connected to the two ACM hubs above
          - series: 'acm_managed_cluster_info{product="OpenShift", _id="hub_cluster", hub_cluster_id="hub_cluster", managed_cluster_id="self_managed_ocp1"}'
            values: '1'
          - series: 'acm_managed_cluster_info{product="OpenShift", _id="another_hub_cluster", hub_cluster_id="another_hub_cluster", managed_cluster_id="self_managed_ocp2"}'
            values: '1'
          - series: 'acm_managed_cluster_worker_cores:max{_id="hub_cluster", hub_cluster_id="hub_cluster", managed_cluster_id="self_managed_ocp1"}'
            values: '32'
          - series: 'acm_managed_cluster_worker_cores:max{_id="another_hub_cluster", hub_cluster_id="another_hub_cluster", managed_cluster_id="self_managed_ocp2"}'
            values: '64'
          # self-managed Microshift cluster connected to the ACM hub running on ROSA
          - series: 'acm_managed_cluster_info{product="MicroShift", _id="hub_cluster", hub_cluster_id="hub_cluster", managed_cluster_id="self_managed_microshift1"}'
            values: '1'
          - series: 'acm_managed_cluster_worker_cores:max{_id="hub_cluster", hub_cluster_id="hub_cluster", managed_cluster_id="self_managed_microshift1"}'
            values: '4'
          # two managed ROSA clusters
          - series: 'acm_managed_cluster_info{product="ROSA", _id="hub_cluster", hub_cluster_id="hub_cluster", managed_cluster_id="managed_rosa1"}'
            values: '1'
          - series: 'acm_managed_cluster_info{product="ROSA", _id="another_hub_cluster", hub_cluster_id="another_hub_cluster", managed_cluster_id="managed_rosa2"}'
            values: '1'
          - series: 'acm_managed_cluster_worker_cores:max{_id="hub_cluster", hub_cluster_id="hub_cluster", managed_cluster_id="managed_rosa1"}'
            values: '24'
          - series: 'acm_managed_cluster_worker_cores:max{_id="another_hub_cluster", hub_cluster_id="another_hub_cluster", managed_cluster_id="managed_rosa2"}'
            values: '32'
          # managed ARO clusters
          - series: 'acm_managed_cluster_info{product="ARO", _id="hub_cluster", hub_cluster_id="hub_cluster", managed_cluster_id="managed_aro1"}'
            values: '1'
          - series: 'acm_managed_cluster_info{product="ARO", _id="another_hub_cluster", hub_cluster_id="another_hub_cluster", managed_cluster_id="managed_aro2"}'
            values: '1'
          - series: 'acm_managed_cluster_worker_cores:max{_id="hub_cluster", hub_cluster_id="hub_cluster", managed_cluster_id="managed_aro1"}'
            values: '24'
          - series: 'acm_managed_cluster_worker_cores:max{_id="another_hub_cluster", hub_cluster_id="another_hub_cluster", managed_cluster_id="managed_aro2"}'
            values: '32'
          # an undefined product ("Other") cluster connected to the first hub that is expected to be counted in the "managed" category
          - series: 'acm_managed_cluster_info{product="Other", _id="hub_cluster", hub_cluster_id="hub_cluster", managed_cluster_id="other_cluster"}'
            values: '1'
          - series: 'acm_managed_cluster_worker_cores:max{_id="hub_cluster", hub_cluster_id="hub_cluster", managed_cluster_id="other_cluster"}'
            values: '8'
      promql_expr_test:
          # only self-managed connected capacity for both hubs
          - expr: acm:managed_cluster_worker_cores:self_managed:sum
            eval_time: 0
            exp_samples:
                - labels: 'acm:managed_cluster_worker_cores:self_managed:sum{_id="hub_cluster"}'
                  value: 36
                - labels: 'acm:managed_cluster_worker_cores:self_managed:sum{_id="another_hub_cluster"}'
                  value: 64
          # only managed connected capacity for both hubs
          - expr: acm:managed_cluster_worker_cores:managed:sum
            eval_time: 0
            exp_samples:
                - labels: 'acm:managed_cluster_worker_cores:managed:sum{_id="hub_cluster"}'
                  value: 72
                - labels: 'acm:managed_cluster_worker_cores:managed:sum{_id="another_hub_cluster"}'
                  value: 80

    # TelemeterClientSendErrors fires when >20% of federate_to requests are non-2xx
    - interval: 1m
      input_series:
          - series: 'metricsclient_http_requests_total{job="telemeter-client",client="federate_to",status_code="401",namespace="openshift-monitoring"}'
            values: '0+1x120'
          - series: 'metricsclient_http_requests_total{job="telemeter-client",client="federate_to",status_code="200",namespace="openshift-monitoring"}'
            values: '0+1x120'
      alert_rule_test:
          - alertname: TelemeterClientSendErrors
            eval_time: 60m
            exp_alerts: []
          - alertname: TelemeterClientSendErrors
            eval_time: 61m
            exp_alerts:
                - exp_labels:
                      severity: warning
                      namespace: openshift-monitoring
                  exp_annotations:
                      summary: Telemeter client is failing to send metrics.
                      description: "The telemeter client in namespace openshift-monitoring has 50% error rate when sending metrics to the telemeter service.\n4xx errors typically indicate an authentication or authorization issue \u2014 check that the global pull secret is valid and up to date:\n  oc get secret pull-secret -n openshift-config -o jsonpath='{.data.\\.dockerconfigjson}' | base64 -d\n5xx errors indicate a server-side issue on Red Hat telemeter service and are not actionable by the cluster administrator.\nSee https://docs.openshift.com/container-platform/latest/openshift_images/managing_images/using-image-pull-secrets.html#images-update-global-pull-secret_using-image-pull-secrets for more details.\n"

    # TelemeterClientSendErrors does NOT fire when error rate < 20%
    - interval: 1m
      input_series:
          - series: 'metricsclient_http_requests_total{job="telemeter-client",client="federate_to",status_code="503",namespace="openshift-monitoring"}'
            values: '0+1x120'
          - series: 'metricsclient_http_requests_total{job="telemeter-client",client="federate_to",status_code="200",namespace="openshift-monitoring"}'
            values: '0+9x120'
      alert_rule_test:
          - alertname: TelemeterClientSendErrors
            eval_time: 75m
            exp_alerts: []

    # TelemeterClientSendErrors does NOT fire at exactly 20% error rate (> 0.2)
    - interval: 1m
      input_series:
          - series: 'metricsclient_http_requests_total{job="telemeter-client",client="federate_to",status_code="401",namespace="openshift-monitoring"}'
            values: '0+1x120'
          - series: 'metricsclient_http_requests_total{job="telemeter-client",client="federate_to",status_code="200",namespace="openshift-monitoring"}'
            values: '0+4x120'
      alert_rule_test:
          - alertname: TelemeterClientSendErrors
            eval_time: 75m
            exp_alerts: []

    # TelemeterClientRetrieveErrors fires when >20% of federate_from requests are non-2xx
    - interval: 1m
      input_series:
          - series: 'metricsclient_http_requests_total{job="telemeter-client",client="federate_from",status_code="403",namespace="openshift-monitoring"}'
            values: '0+1x120'
          - series: 'metricsclient_http_requests_total{job="telemeter-client",client="federate_from",status_code="200",namespace="openshift-monitoring"}'
            values: '0+1x120'
      alert_rule_test:
          - alertname: TelemeterClientRetrieveErrors
            eval_time: 60m
            exp_alerts: []
          - alertname: TelemeterClientRetrieveErrors
            eval_time: 61m
            exp_alerts:
                - exp_labels:
                      severity: warning
                      namespace: openshift-monitoring
                  exp_annotations:
                      summary: Telemeter client is failing to retrieve metrics from Prometheus.
                      description: "The telemeter client in namespace openshift-monitoring has 50% error rate when retrieving metrics from the in-cluster Prometheus.\n4xx errors may indicate an RBAC issue or misconfigured service account token.\n5xx errors may indicate that Prometheus is overloaded or unhealthy.\nCheck the telemeter-client logs:\n  oc logs -n openshift-monitoring deployment/telemeter-client -c telemeter-client\n"

    # TelemeterClientRetrieveErrors does NOT fire when error rate < 20%
    - interval: 1m
      input_series:
          - series: 'metricsclient_http_requests_total{job="telemeter-client",client="federate_from",status_code="500",namespace="openshift-monitoring"}'
            values: '0+1x120'
          - series: 'metricsclient_http_requests_total{job="telemeter-client",client="federate_from",status_code="200",namespace="openshift-monitoring"}'
            values: '0+9x120'
      alert_rule_test:
          - alertname: TelemeterClientRetrieveErrors
            eval_time: 75m
            exp_alerts: []

    # TelemeterClientRetrieveErrors does NOT fire at exactly 20% error rate (> 0.2)
    - interval: 1m
      input_series:
          - series: 'metricsclient_http_requests_total{job="telemeter-client",client="federate_from",status_code="500",namespace="openshift-monitoring"}'
            values: '0+1x120'
          - series: 'metricsclient_http_requests_total{job="telemeter-client",client="federate_from",status_code="200",namespace="openshift-monitoring"}'
            values: '0+4x120'
      alert_rule_test:
          - alertname: TelemeterClientRetrieveErrors
            eval_time: 75m
            exp_alerts: []

    # No alerts fire when all requests are successful
    - interval: 1m
      input_series:
          - series: 'metricsclient_http_requests_total{job="telemeter-client",client="federate_to",status_code="200",namespace="openshift-monitoring"}'
            values: '0+10x120'
          - series: 'metricsclient_http_requests_total{job="telemeter-client",client="federate_from",status_code="200",namespace="openshift-monitoring"}'
            values: '0+10x120'
      alert_rule_test:
          - alertname: TelemeterClientSendErrors
            eval_time: 75m
            exp_alerts: []
          - alertname: TelemeterClientRetrieveErrors
            eval_time: 75m
            exp_alerts: []
