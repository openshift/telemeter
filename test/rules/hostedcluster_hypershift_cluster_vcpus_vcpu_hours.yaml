            values: '0x90 4x90 0x90'
      promql_expr_test:
          - expr: hostedcluster:hypershift_cluster_vcpus:vcpu_hours
            eval_time: 0
            exp_samples:
                - labels: 'hostedcluster:hypershift_cluster_vcpus:vcpu_hours{_id="my-id"}'
                  value: 0
